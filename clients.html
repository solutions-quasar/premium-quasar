<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Our Work | Solutions Quasar</title>
    <meta name="description"
        content="Discover our premium digital architecture projects and clients we've helped scale.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css?v=6">

    <!-- Open Graph -->
    <meta property="og:title" content="Our Work | Solutions Quasar">
    <meta property="og:description" content="Premium digital experiences built for high standard businesses.">
    <meta property="og:image" content="hero-desktop.png">
    <meta property="og:type" content="website">

    <script src="script.js?v=10" defer></script>
</head>

<body id="top">

    <!-- Desktop Header -->
    <header id="top-bar">
        <div class="nav-content">
            <div class="brand">SQ.</div>
            <nav class="desktop-nav"></nav>
            <div class="contact-actions">
                <a href="#" class="contact-phone"></a>
                <a href="#" class="contact-email"></a>
            </div>
        </div>
    </header>

    <!-- Mobile Header -->
    <header class="mobile-top-bar">
        <div class="mobile-logo brand">SQ.</div>
        <a href="#" class="mobile-call-btn"></a>
    </header>

    <main>
        <!-- Hero Clients -->
        <section class="hero-service hero-service-bg"
            style="background-image: url('hero-desktop.png'); padding-top: var(--header-height); min-height: 50vh; display: flex; align-items: center; justify-content: center; text-align: center;">
            <div class="container">
                <span class="uppercase text-gold" data-i18n="clientsPage.hero.subtitle"
                    style="display: block; margin-bottom: 0.5rem;">Our Work</span>
                <h1 style="font-size: var(--h1); line-height: 1.2; margin-bottom: 1.5rem; background: linear-gradient(135deg, #fff 20%, var(--gold-light) 90%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 0.15em; display: inline-block;"
                    data-i18n="clientsPage.hero.h1">
                    Premium Digital Experiences we built
                </h1>
                <p style="font-size: var(--body-lg); max-width: 700px; margin: 0 auto; color: var(--text-muted);"
                    data-i18n="clientsPage.hero.desc">
                    Explore the systems and architectures that power some of our most demanding clients.
                </p>
            </div>
        </section>

        <!-- Clients Showcase -->
        <section style="padding: var(--section-pad) 0; background: var(--bg-card);">
            <div class="container">
                <div style="text-align: center; margin-bottom: 4rem;">
                    <span class="uppercase text-gold" data-i18n="clientsPage.showcase.subtitle">Portfolio</span>
                    <h2 data-i18n="clientsPage.showcase.title">Trusted by Professionals</h2>
                </div>

                <div class="services-grid" id="clients-grid">
                    <!-- Client cards will be injected by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Contact -->
        <section id="contact">
            <div class="container">
                <div class="contact-layout">
                    <!-- Form -->
                    <div class="form-wrapper">
                        <h2 data-i18n="contact.title">Book a Strategy Call</h2>
                        <p class="text-muted" style="margin-bottom:2rem;" data-i18n="contact.subtitle">Tell us what you
                            need. We’ll reply with next steps.</p>

                        <form id="contact-form" class="premium-form">
                            <!-- Anti-Spam Honeypot Field -->
                            <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

                            <div class="form-group">
                                <label class="form-label" for="contact-name" data-i18n="contact.form.name">Full Name *</label>
                                <input type="text" id="contact-name" name="name" class="form-input" required placeholder="John Doe" data-i18n-ph="contact.form.namePlaceholder">
                            </div>

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" for="contact-email" data-i18n="contact.form.email">Email Address *</label>
                                    <input type="email" id="contact-email" name="email" class="form-input" required placeholder="john@example.com" data-i18n-ph="contact.form.emailPlaceholder">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="contact-phone" data-i18n="contact.form.phone">Phone / Mobile *</label>
                                    <input type="tel" id="contact-phone" name="phone" class="form-input" required placeholder="+1 (506) 233-7006" data-i18n-ph="contact.form.phonePlaceholder">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="contact-company" data-i18n="contact.form.company">Company / Firm (Optional)</label>
                                <input type="text" id="contact-company" name="company" class="form-input" placeholder="Miller Law Group" data-i18n-ph="contact.form.companyPlaceholder">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="contact-message" data-i18n="contact.form.message">Project Details</label>
                                <textarea id="contact-message" name="message" class="form-textarea" rows="3" placeholder="Tell us about your project..." data-i18n-ph="contact.form.messagePlaceholder"></textarea>
                            </div>

                            <!-- 10DLC Mandatory SMS Consent Checkbox (Unchecked by default) -->
                            <div class="form-group" style="margin-top: 1rem; margin-bottom: 1.5rem; background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px 14px;">
                                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 0.8rem; line-height: 1.5; color: var(--text-muted);">
                                    <input type="checkbox" id="sms-consent" name="sms_consent" style="margin-top: 3px; accent-color: var(--gold); width: 16px; height: 16px; flex-shrink: 0;" required>
                                    <span data-i18n="contact.form.smsConsent">
                                        I consent to receive text messages (SMS) from Solutions Quasar Inc. at the phone number provided above regarding my inquiry, appointment confirmations, and project follow-ups. Message frequency varies. Standard message and data rates may apply. Reply STOP to cancel at any time, reply HELP for customer assistance. View our <a href="privacy.html" target="_blank" style="color: var(--gold); text-decoration: underline;">Privacy Policy</a> and <a href="terms.html" target="_blank" style="color: var(--gold); text-decoration: underline;">Terms of Service</a>.
                                    </span>
                                </label>
                            </div>

                            <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer;" data-i18n="contact.form.submit">
                                Book Strategy Call
                            </button>
                        </form>
                    </div>

                    <!-- Info -->
                    <div>
                        <div class="contact-card">
                            <div>
                                <h3 style="margin-bottom:1.5rem">Contact</h3>
                                <p class="info-phone" style="margin-bottom:1rem"></p>
                                <p class="info-email" style="margin-bottom:1rem"></p>
                                <p class="info-address"></p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container"></div>
    </footer>

    <!-- Mobile Bottom Bar -->
    <div id="mobile-bar">
        <button class="bar-item" id="btn-menu"></button>
        <a href="#" class="bar-item" id="btn-call"></a>
        <button class="bar-item" id="btn-msg"></button>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="menu-overlay">
        <button class="menu-close" id="btn-close-menu"></button>
        <nav class="menu-nav"></nav>
        <div style="margin-top:3rem; text-align:center; opacity:0.6; font-size:0.9rem">
            <p>Solutions Quasar Inc.</p>
        </div>
    </div>

</body>

</html>
