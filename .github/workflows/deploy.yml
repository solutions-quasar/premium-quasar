name: Deploy Static Site

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Deployment Artifact
        run: |
          mkdir dist
          # Copy Landing Page Root Files
          cp *.* dist/ 2>/dev/null || :

          # Copy Demo Folder
          cp -r demo dist/ 2>/dev/null || :
          
          # Copy ERP Folder (Recursively)
          cp -r erp dist/
          
          # CRITICAL SECURITY: Never expose backend source code or configs on static GitHub Pages
          rm -rf dist/erp/backend

          # Remove logs, debug dumps and heavy raw files
          rm -f dist/*.log dist/log_output.* dist/logo.b64
          
          # Ensure no CNAME conflicts if present
          cp CNAME dist/ 2>/dev/null || :

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
